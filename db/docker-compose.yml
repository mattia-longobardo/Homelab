services:

# Prometheus # --------------------------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "1000:1000"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - metrics_internal
      - db_internal

# PostgreSQL # --------------------------------------------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    mem_limit: 6g
    cpus: "4.0"
    shm_size: 1g
    user: 1000:1000
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - db_internal

# ArangoDB # --------------------------------------------------------------------------------------------------------------
  arangodb:
    image: arangodb:3.12
    container_name: arangodb
    restart: unless-stopped
    mem_limit: 4g
    cpus: "3.0"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    volumes:
      - ./arangodb/data:/var/lib/arangodb3
      - ./arangodb/apps:/var/lib/arangodb3-apps
    networks:
      - db_internal

# Silo # --------------------------------------------------------------------------------------------------------------
  silo:
    image: pgsty/silo:latest
    container_name: silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      TZ: Europe/Rome
    volumes:
      - /home/mattia/storage/silo:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db_internal

# Redis # --------------------------------------------------------------------------------------------------------------
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD}
    mem_limit: 1g
    cpus: "1.0"
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_internal

networks:
  db_internal:
    name: db_internal
  metrics_internal:
    external: true
  proxy_public:
    external: true
