services:

# Prometheus # --------------------------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: "1000:1000"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./prometheus/data:/prometheus
    restart: unless-stopped
    mem_limit: 4g
    cpus: "1.5"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--config.auto-reload'
      - '--config.auto-reload-interval=30s'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "autoheal=true"
    networks:
      - metrics_internal
      - db_internal

# PostgreSQL # --------------------------------------------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    user: "1000:1000"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
      - "192.168.1.220:5432:5432"
    restart: unless-stopped
    mem_limit: 6g
    cpus: "4.0"
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -h 127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - db_internal

# ArangoDB # --------------------------------------------------------------------------------------------------------------
  arangodb:
    image: arangodb:3.12
    container_name: arangodb
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD}
    volumes:
      - ./arangodb/data:/var/lib/arangodb3
      - ./arangodb/apps:/var/lib/arangodb3-apps
    restart: unless-stopped
    mem_limit: 2g
    cpus: "3.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8529/_admin/server/availability"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.arangodb-router.rule=Host(`arango.local`)"
      - "traefik.http.routers.arangodb-router.entrypoints=web"
      - "traefik.http.routers.arangodb-router.middlewares=lan-only@file"
      - "traefik.http.services.arangodb-service.loadbalancer.server.port=8529"
    networks:
      - proxy_public
      - db_internal

# Silo # --------------------------------------------------------------------------------------------------------------
  silo:
    image: pgsty/silo:latest
    container_name: silo
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD}
      TZ: Europe/Rome
    volumes:
      - /home/mattia/storage/silo:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.silo-router.rule=Host(`silo.local`)"
      - "traefik.http.routers.silo-router.entrypoints=web"
      - "traefik.http.routers.silo-router.middlewares=lan-only@file"
      - "traefik.http.services.silo-service.loadbalancer.server.port=9001"
    networks:
      - proxy_public
      - db_internal

# Redis # --------------------------------------------------------------------------------------------------------------
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD}
    mem_limit: 1g
    cpus: "1.0"
    volumes:
      - ./redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_internal

networks:
  db_internal:
    name: db_internal
  metrics_internal:
    external: true
  proxy_public:
    external: true
