services:

# Plex # --------------------------------------------------------------------------------------------------------------
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    user: "1000:1000"
    runtime: nvidia
    environment:
      - TZ=Europe/Rome
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - ADVERTISE_IP=${PLEX_ADVERTISE_IP}
    ports:
      - "32400:32400"
    volumes:
      - ./plex:/config
      - ../../storage/movies:/movies
      - ../../storage/tv:/tv
      - ../../storage/private:/private
      - /dev/shm:/transcode
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    mem_limit: 4g
    cpus: "4.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:32400/identity"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - proxy_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.plex-router.rule=Host(`plex.local`) || Host(`${PLEX_HOST}`)"
      - "traefik.http.routers.plex-router.entrypoints=web"
      - "traefik.http.services.plex-service.loadbalancer.server.port=32400"

# PlexSyncer # --------------------------------------------------------------------------------------------------------------
  plex-syncer:
    build: ./plex-syncer
    image: plex-syncer:latest
    container_name: plex-syncer
    user: "1000:1000"
    depends_on:
      - plex
    environment:
      - TZ=Europe/Rome
      - PLEX_URL=http://plex:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_LIBRARY=Private
      - PLEX_PRIVATE_ROOT=/private
      - SYNCER_DB=/data/plex-syncer.db
      - DEDUP_DIR=/data/dedup
    volumes:
      - ./plex-syncer/data:/data
      - ./plex-syncer/config:/config:ro
      - ../../storage/private/Models:/private/Models
      - ../../storage/private/Cams:/private/Cams
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - proxy_public

# qBittorrent # --------------------------------------------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./qbittorrent:/config
      - ../../storage/downloads:/downloads
      - ../../storage/movies:/movies
      - ../../storage/tv:/tv
      - ../../storage/private:/private
    restart: unless-stopped
    mem_limit: 1g
    cpus: "2.0"
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.qbittorrent-router.rule=Host(`torrent.local`)'
      - 'traefik.http.routers.qbittorrent-router.entrypoints=web'
      - 'traefik.http.services.qbittorrent-service.loadbalancer.server.port=8080'
    networks:
      - proxy_public

# Tdarr # --------------------------------------------------------------------------------------------------------------
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=true
      - inContainer=true
      - nodeName=nas-node
    volumes:
      - ./tdarr/server:/app/server
      - ./tdarr/configs:/app/configs
      - ./tdarr/logs:/app/logs
      - ../backups/tdarr:/app/server/Tdarr/Backups
      - ../../storage/private:/mnt/private
      - ../../storage/tdarr_cache:/temp
    restart: unless-stopped
    mem_limit: 6g
    cpus: "4.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8265"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy_public'
      - 'traefik.http.routers.tdarr-router.rule=Host(`tdarr.local`)'
      - 'traefik.http.routers.tdarr-router.entrypoints=web'
      - 'traefik.http.routers.tdarr-router.middlewares=lan-only@file'
      - 'traefik.http.services.tdarr-service.loadbalancer.server.port=8265'
    networks:
      - proxy_public

networks:
  proxy_public:
    external: true
