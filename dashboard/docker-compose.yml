services:

# Portainer # --------------------------------------------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-router.rule=Host(`${PORTAINER_HOST}`)"
      - "traefik.http.routers.portainer-router.entrypoints=web"
      - "traefik.http.routers.portainer-router.middlewares=portainer-xfp@docker"
      - "traefik.http.middlewares.portainer-xfp.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.portainer-xfp.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"
    networks:
      - proxy_public

# Grafana # --------------------------------------------------------------------------------------------------------------

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    user: "1000:1000"
    environment:
      # SMTP via Stalwart (rete mail_internal): 587 STARTTLS, il mailer di
      # Grafana non supporta il TLS implicito della 465.
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:587
      - GF_SMTP_USER=${SMTP_NOREPLY_USER}
      - GF_SMTP_PASSWORD=${SMTP_NOREPLY_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_NOREPLY_USER}
      - GF_SMTP_FROM_NAME=Grafana
      # SSO via Authentik (OIDC): match per email sull'account esistente
      # (ALLOW_INSECURE_EMAIL_LOOKUP), nessuna creazione automatica di utenti
      # (ALLOW_SIGN_UP=false) e ruoli gestiti in Grafana (SKIP_ORG_ROLE_SYNC).
      # Il lookup per email è sicuro SOLO finché Authentik resta senza
      # self-signup/enrollment e con email gestite dall'admin.
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOST}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${AUTHENTIK_HOST}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://${AUTHENTIK_HOST}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://${AUTHENTIK_HOST}/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=false
      - GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC=true
      - GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=true
      # Token dell'applicazione "Grafana" su Gotify. Serviva a interpolare
      # $GOTIFY_APP_TOKEN nei file di provisioning alerting: dal 2026-08-22 non
      # c'e' piu' provisioning e il token e' gia' risolto dentro il contact
      # point nel DB. Tenuto solo per poter riabilitare il provisioning.
      - GOTIFY_APP_TOKEN=${GOTIFY_APP_TOKEN}
    volumes:
      # Unica fonte di verita': il DB. Alerting e dashboard NON sono piu'
      # provisioned da file (2026-08-22): con provenance=file Grafana li marca
      # immutabili e la UI non li lascia modificare, nemmeno da admin. I marker
      # sono stati rimossi dal DB (provenance_type + annotation
      # grafana.app/managedBy) e i due mount di provisioning tolti qui sotto.
      # Tutto cio' che riguarda Grafana sta sotto ./grafana: i vecchi file di
      # provisioning (ora inerti) in ./grafana/grafana-alerting e
      # ./grafana/grafana-dashboards, lo snapshot del DB pre-conversione in
      # ./grafana/grafana.db.bak-2026-08-22.
      # ATTENZIONE: regole di alerting e dashboard vivono solo in ./grafana
      # (gitignored) -> senza backup di quella cartella si perdono.
      - ./grafana:/var/lib/grafana  # Persists dashboards, alerting, users
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.grafana-router.rule=Host(`${GRAFANA_HOST}`)"
      - "traefik.http.routers.grafana-router.entrypoints=web"
      - "traefik.http.services.grafana-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - metrics_internal
      - mail_internal


# Gotify # --------------------------------------------------------------------------------------------------------------

  gotify:
    image: gotify/server:latest
    container_name: gotify
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_ADMIN_USERNAME}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_ADMIN_PASSWORD}
    volumes:
      - ./gotify:/app/data
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.gotify-router.rule=Host(`${GOTIFY_HOST}`)"
      - "traefik.http.routers.gotify-router.entrypoints=web"
      - "traefik.http.services.gotify-service.loadbalancer.server.port=80"
    networks:
      - proxy_public

# Blackbox Exporter # --------------------------------------------------------------------------------------------------------------

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - metrics_internal

# Monitoring & Metrics Docker # --------------------------------------------------------------------------------------------------------------

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.0"
    networks:
      - proxy_public
      - metrics_internal


# Node Exporter # --------------------------------------------------------------------------------------------------------------

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:rw,rslave
      - /run/udev:/run/udev:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    networks:
      - proxy_public
      - metrics_internal

networks:
  proxy_public:
    external: true
  metrics_internal:
    external: true
  db_internal:
    external: true
  mail_internal:
    external: true