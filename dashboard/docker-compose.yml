services:

# Portainer # --------------------------------------------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer-router.rule=Host(`${PORTAINER_HOST}`)"
      - "traefik.http.routers.portainer-router.entrypoints=web"
      - "traefik.http.routers.portainer-router.middlewares=portainer-xfp@docker"
      - "traefik.http.middlewares.portainer-xfp.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.portainer-xfp.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.services.portainer-service.loadbalancer.server.port=9000"
    networks:
      - proxy_public

# Grafana # --------------------------------------------------------------------------------------------------------------

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    user: "1000:1000"
    environment:
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST}:587
      - GF_SMTP_USER=${SMTP_NOREPLY_USER}
      - GF_SMTP_PASSWORD=${SMTP_NOREPLY_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_NOREPLY_USER}
      - GF_SMTP_FROM_NAME=Grafana
      - GF_SERVER_ROOT_URL=https://${GRAFANA_HOST}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://${AUTHENTIK_HOST}/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://${AUTHENTIK_HOST}/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://${AUTHENTIK_HOST}/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=false
      - GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC=true
      - GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=true
      - GOTIFY_APP_TOKEN=${GOTIFY_APP_TOKEN}
    volumes:
      - ./grafana:/var/lib/grafana
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.grafana-router.rule=Host(`${GRAFANA_HOST}`)"
      - "traefik.http.routers.grafana-router.entrypoints=web"
      - "traefik.http.services.grafana-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - metrics_internal
      - mail_internal

# Gotify # --------------------------------------------------------------------------------------------------------------

  gotify:
    image: gotify/server:latest
    container_name: gotify
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_ADMIN_USERNAME}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_ADMIN_PASSWORD}
    volumes:
      - ./gotify:/app/data
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.gotify-router.rule=Host(`${GOTIFY_HOST}`)"
      - "traefik.http.routers.gotify-router.entrypoints=web"
      - "traefik.http.services.gotify-service.loadbalancer.server.port=80"
    networks:
      - proxy_public

# Phoenix # --------------------------------------------------------------------------------------------------------------

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_SQL_DATABASE_URL=postgresql://phoenix:${DB_PHOENIX_PASSWORD}@postgres:5432/phoenix
      - PHOENIX_ENABLE_AUTH=true
      - PHOENIX_SECRET=${PHOENIX_SECRET}
      - PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD=${PHOENIX_ADMIN_INITIAL_PASSWORD}
      - PHOENIX_USE_SECURE_COOKIES=false
      - PHOENIX_CSRF_TRUSTED_ORIGINS=http://${PHOENIX_HOST}
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=90
      - PHOENIX_ENABLE_PROMETHEUS=true
      - PHOENIX_TELEMETRY_ENABLED=false
    volumes:
      - ./phoenix:/mnt/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/', timeout=5).status < 500 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.phoenix-router.rule=Host(`${PHOENIX_HOST}`)"
      - "traefik.http.routers.phoenix-router.entrypoints=web"
      - "traefik.http.routers.phoenix-router.middlewares=lan-only@file"
      - "traefik.http.services.phoenix-service.loadbalancer.server.port=6006"
    networks:
      - proxy_public
      - db_internal
      - metrics_internal

# Blackbox Exporter # --------------------------------------------------------------------------------------------------------------

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    user: "1000:1000"
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.1"
    networks:
      - metrics_internal

# Monitoring & Metrics Docker # --------------------------------------------------------------------------------------------------------------

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.0"
    networks:
      - proxy_public
      - metrics_internal

# Node Exporter # --------------------------------------------------------------------------------------------------------------

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    network_mode: host
    privileged: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:rw,rslave
      - /run/udev:/run/udev:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.listen-address=172.20.0.1:9100'
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"

# Umami # ------------------------------------------------------------------------------------------------------------------------

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
      - DATABASE_TYPE=postgresql
      - DATABASE_URL=postgresql://umami:${DB_UMAMI_PASSWORD}@postgres:5432/umami
      - APP_SECRET=${UMAMI_APP_SECRET}
      # Umami is cookieless by design: visitors are counted with a salted daily
      # hash, so the site needs no consent banner. Keep it that way.
      - DISABLE_TELEMETRY=1
      # Serve the tracker under a neutral name; the default /umami.js is on
      # most blocker lists, which would silently lose most of the traffic.
      - TRACKER_SCRIPT_NAME=script.js
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.umami-router.rule=Host(`${UMAMI_HOST}`)"
      - "traefik.http.routers.umami-router.entrypoints=web"
      # Deliberately NOT lan-only: visitors' browsers must reach the tracker
      # script and /api/send from the public internet.
      - "traefik.http.services.umami-service.loadbalancer.server.port=3000"
    networks:
      - proxy_public
      - db_internal

networks:
  proxy_public:
    external: true
  metrics_internal:
    external: true
  db_internal:
    external: true
  mail_internal:
    external: true
