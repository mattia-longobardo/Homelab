services:

# Komga # --------------------------------------------------------------------------------------------------------------
  komga:
    image: gotson/komga:latest
    container_name: komga
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./komga:/config
      - ../../storage/books:/data
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:25600/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "autoheal=true"
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.komga-router.rule=Host(`${KOMGA_HOST}`)"
      - "traefik.http.routers.komga-router.entrypoints=web"
      - "traefik.http.services.komga-service.loadbalancer.server.port=25600"
      - "traefik.http.middlewares.komga-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.komga-router.middlewares=komga-https"
    networks:
      - proxy_public

networks:
  proxy_public:
    external: true
