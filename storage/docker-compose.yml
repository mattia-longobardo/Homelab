services:

# Bytestash # --------------------------------------------------------------------------------------------------------------
  bytestash:
    image: "ghcr.io/jordan-dalby/bytestash:latest"
    container_name: bytestash
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    volumes:
      - ./bytestash:/data/snippets
    environment:
      BASE_PATH: ""
      JWT_SECRET: ${BYTESTASH_JWT_SECRET}
      TOKEN_EXPIRY: 24h
      ALLOW_NEW_ACCOUNTS: "true"
      DEBUG: "true"
      DISABLE_ACCOUNTS: "false"
      DISABLE_INTERNAL_ACCOUNTS: "false"
      OIDC_ENABLED: "false"
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.bytestash-router.rule=Host(`${BYTESTASH_HOST}`)'
      - 'traefik.http.routers.bytestash-router.entrypoints=web'
      - 'traefik.http.services.bytestash-service.loadbalancer.server.port=5000'
    networks:
      - proxy_public

# Paperless # --------------------------------------------------------------------------------------------------------------

  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-ngx
    volumes:
      - ./paperless-ngx/data:/usr/src/paperless/data
      - ./paperless-ngx/media:/usr/src/paperless/media
      - ./paperless-ngx/export:/usr/src/paperless/export
      - ./paperless-ngx/consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD}@redis:6379/1
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPASS: ${DB_PAPERLESS_PASSWORD}
      PAPERLESS_SECRET_KEY: ${SECRET_KEY}
      PAPERLESS_URL: https://${PAPERLESS_HOST}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://${PAPERLESS_HOST}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_HOST}, localhost
      PAPERLESS_CORS_ALLOWED_ORIGINS: https://${PAPERLESS_HOST}
      PAPERLESS_PROXY_HEADERS: "true"
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_USE_X_FORWARD_PORT: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect": {"SCOPE": ["openid", "profile", "email"], "APPS": [{"provider_id": "authentik", "name": "Authentik", "client_id": "${PAPERLESS_OIDC_CLIENT_ID}", "secret": "${PAPERLESS_OIDC_CLIENT_SECRET}", "settings": {"server_url": "https://${AUTHENTIK_HOST}/application/o/paperless/.well-known/openid-configuration"}}]}}'
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "false"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
      PAPERLESS_EMAIL_HOST: ${SMTP_HOST}
      PAPERLESS_EMAIL_PORT: "465"
      PAPERLESS_EMAIL_USE_SSL: "true"
      PAPERLESS_EMAIL_HOST_USER: ${SMTP_NOREPLY_USER}
      PAPERLESS_EMAIL_HOST_PASSWORD: ${SMTP_NOREPLY_PASSWORD}
      PAPERLESS_EMAIL_FROM: ${SMTP_NOREPLY_USER}
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.0"
    labels:
      - traefik.enable=true
      - traefik.http.routers.paperless.rule=Host(`${PAPERLESS_HOST}`)
      - traefik.http.routers.paperless.entrypoints=web
      - "traefik.docker.network=proxy_public"
      - traefik.http.services.paperless.loadbalancer.server.port=8000
      - traefik.http.middlewares.paperless-forward.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.paperless.middlewares=paperless-forward
    networks:
      - proxy_public
      - db_internal
      - mail_internal

# Seafile # --------------------------------------------------------------------------------------------------------------

  db:
    image: mariadb:10.11
    container_name: seafile-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_SEAFILE_PASSWORD}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - /home/mattia/storage/seafile/seafile-mysql/db:/var/lib/mysql
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    networks:
      - seafile_internal

  seafile:
    image: seafileltd/seafile-mc:13.0-latest
    container_name: seafile
    volumes:
      - /home/mattia/storage/seafile/seafile-data:/shared
    tmpfs:
      - /opt/seafile/pids:mode=1777
    environment:
      - NON_ROOT=true
      - SEAFILE_MYSQL_DB_HOST=db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=root
      - SEAFILE_MYSQL_DB_PASSWORD=${DB_SEAFILE_PASSWORD}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${DB_SEAFILE_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=seahub_db
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_PRIVATE_KEY}
      - TIME_ZONE=Europe/Rome
      - SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_SERVER_HOSTNAME=${SEAFILE_SERVER_HOSTNAME}
      - SEAFILE_SERVER_PROTOCOL=https
      - SEAFILE_LOG_TO_STDOUT=true
      - CACHE_PROVIDER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - db
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    labels:
      - 'autoheal=true'
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy_public'
      - 'traefik.http.routers.seafile-router.rule=Host(`${SEAFILE_HOST}`)'
      - 'traefik.http.routers.seafile-router.entrypoints=web'
      - 'traefik.http.services.seafile-service.loadbalancer.server.port=80'
    networks:
      - proxy_public
      - seafile_internal
      - db_internal
      - mail_internal

# Immich # --------------------------------------------------------------------------------------------------------------

  immich:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich
    user: "1000:1000"
    depends_on:
      - immich-postgres
    environment:
      - TZ=Europe/Rome
      - IMMICH_PORT=2283
      - DB_HOSTNAME=immich-postgres
      - DB_PORT=5432
      - DB_USERNAME=immich
      - DB_PASSWORD=${DB_IMMICH_PASSWORD}
      - DB_DATABASE_NAME=immich
      - DB_VECTOR_EXTENSION=vectorchord
      - REDIS_HOSTNAME=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DBINDEX=5
      - IMMICH_MACHINE_LEARNING_URL=http://immich-ml:3003
    volumes:
      - /home/mattia/storage/photos:/data
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "immich-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - 'autoheal=true'
      - 'traefik.enable=true'
      - 'traefik.docker.network=proxy_public'
      - 'traefik.http.routers.immich-router.rule=Host(`${IMMICH_HOST}`)'
      - 'traefik.http.routers.immich-router.entrypoints=web'
      - 'traefik.http.services.immich-service.loadbalancer.server.port=2283'
      - 'traefik.http.middlewares.immich-https.headers.customrequestheaders.X-Forwarded-Proto=https'
      - 'traefik.http.routers.immich-router.middlewares=immich-https'
      - 'traefik.http.routers.immich-secure-router.rule=Host(`${IMMICH_HOST}`)'
      - 'traefik.http.routers.immich-secure-router.entrypoints=websecure'
      - 'traefik.http.routers.immich-secure-router.tls=true'
      - 'traefik.http.routers.immich-secure-router.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.immich-secure-router.service=immich-service'
      - 'traefik.http.routers.immich-secure-router.middlewares=immich-https,lan-only@file'
    networks:
      - proxy_public
      - db_internal
      - immich_internal

  immich-ml:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-ml
    user: "1000:1000"
    environment:
      - TZ=Europe/Rome
      - MACHINE_LEARNING_WORKERS=1
    volumes:
      - ./immich/ml-cache:/cache
    restart: unless-stopped
    mem_limit: 4g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "python3 healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - 'autoheal=true'
    networks:
      - immich_internal

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    user: "1000:1000"
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=${DB_IMMICH_PASSWORD}
      - POSTGRES_DB=immich
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ./immich/postgres:/var/lib/postgresql/data
    shm_size: 256m
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - immich_internal

networks:
  proxy_public:
    external: true
  db_internal:
    external: true
  mail_internal:
    external: true
  seafile_internal:
    name: seafile_internal
    internal: true
  immich_internal:
    name: immich_internal
